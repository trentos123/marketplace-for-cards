{% extends "marketplace/base.html" %}

{% block content %}

<div style="max-width:600px; margin:auto; background:white; padding:20px;">

  {% if card.image %}
    <img src="{{ card.image.url }}" style="width:100%; height:300px; object-fit:cover;">
  {% endif %}

  <h1>{{ card.title }}</h1>
  <p>{{ card.description }}</p>
  <h2>${{ card.price }}</h2>

  <a href="/add/{{ card.id }}/">Add to Cart</a>

</div>

{% endblock %}
