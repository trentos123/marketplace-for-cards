{% extends "marketplace/base.html" %}

{% block content %}

<h2 style="padding:20px;">Marketplace</h2>

<div class="grid">

    {% for c in cards %}
    <div class="card">

        <a href="/card/{{ c.id }}">

            {% if c.image %}
                <img src="{{ c.image.url }}">
            {% else %}
                <div style="height:160px;display:flex;align-items:center;justify-content:center;background:#333;">
                    No Image
                </div>
            {% endif %}

        </a>

        <h3>{{ c.title }}</h3>
        <p>${{ c.price }}</p>
        <p>{{ c.rarity|title }}</p>

        <a href="/add/{{ c.id }}/">
            <button>Add to Cart</button>
        </a>

    </div>
    {% empty %}
        <p style="padding:20px;">No cards yet. Be the first seller.</p>
    {% endfor %}

</div>

{% endblock %}
