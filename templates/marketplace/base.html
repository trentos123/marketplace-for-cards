<!DOCTYPE html>
<html>
<head>
    <title>TCG Market</title>

    <style>
        body {
            margin: 0;
            font-family: system-ui;
            background: #0b0b0f;
            color: white;
        }

        /* NAV */
        .nav {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #111;
        }

        .nav a {
            color: white;
            margin-right: 12px;
            text-decoration: none;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            padding: 20px;
        }

        /* CARD */
        .card {
            background: #1a1a22;
            padding: 10px;
            border-radius: 10px;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        button {
            padding: 8px 10px;
            border: none;
            background: #7c5cff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <div>
        <a href="/">Home</a>
        <a href="/dashboard/">Dashboard</a>
        <a href="/cart/">Cart</a>
        <a href="/create/">Sell</a>
    </div>

    <div>
        {% if user.is_authenticated %}
            <span>Hi {{ user.username }}</span>
            <a href="/accounts/logout/">Logout</a>
        {% else %}
            <a href="/accounts/login/">Login</a>
            <a href="/register/">Register</a>
        {% endif %}
    </div>
</div>

<!-- PAGE CONTENT -->
{% block content %}{% endblock %}

</body>
</html>
