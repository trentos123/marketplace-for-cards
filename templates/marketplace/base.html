<!DOCTYPE html>
<html>
<head>
<title>TCG Market</title>

<style>
/* keep your CSS exactly as-is */
:root {
    --bg:#0b0b0f;
    --panel:#15151c;
    --panel2:#1c1c25;
    --text:#ffffff;
    --muted:#a1a1aa;
    --accent:#7c5cff;
    --good:#22c55e;
}

body { margin:0; font-family:system-ui; background:var(--bg); color:var(--text); }

.nav {
    display:flex;
    justify-content:space-between;
    padding:16px 24px;
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    position:sticky;
    top:0;
}

.nav a { color:white; margin-left:12px; text-decoration:none; opacity:0.8; }
.nav a:hover { opacity:1; }
</style>
</head>

<body>

<div class="nav">
    <div><b>TCG MARKET</b></div>

    <div>
        <a href="/">Home</a>
        <a href="/dashboard/">Dashboard</a>
        <a href="/create/">Sell</a>

        {% if user.is_authenticated %}
            <span>Hi {{ user.username }}</span>
            <a href="/accounts/logout/">Logout</a>
        {% else %}
            <a href="/accounts/login/">Login</a>
        {% endif %}
    </div>
</div>

{% block content %}{% endblock %}

</body>
</html>
